[project]
name = "openevomdt"
version = "0.1.0"
description = "Python reproduction of the EvoMDT multi-agent oncology framework."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bert-score>=0.3.13",
    "openai>=1.97.1",
    "pydantic>=2.11.7",
    "pytest>=8.3.5",
    "rouge-score>=0.1.2",
    "tenacity>=9.1.2",
    "torch>=2.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evomdt"]
